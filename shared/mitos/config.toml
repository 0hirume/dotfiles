theme = "kanagawa-rich"

[editor]
atomic-save = false
color-modes = true
completion-trigger-len = 1
default-line-ending = "lf"
end-of-line-diagnostics = "hint"
icons = true
mouse = false
rainbow-brackets = true
shell = ["nu", "-c"]
trim-final-newlines = true
trim-trailing-whitespace = true

[editor.breadcrumb]
enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true
display-progress-messages = true

[editor.statusline]
left = [
  "mode",
  "branch",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
  "diagnostics",
]
right = [
  "spinner",
  "code-action-hint",
  "file-encoding",
  "file-indent-style",
  "file-line-ending",
  "file-type",
  "selections",
  "register",
  "position",
  "total-line-numbers",
]

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"

[editor.whitespace.render]
tab = "all"

[keys.normal]
C-g = [
  ":write-all",
  ":vsplit",
  ":quit",
  ':insert-output lazygit out+err> (if $nu.os-info.name == "windows" { "\\\\.\\CONOUT$" } else { "/dev/tty" })',
  ':insert-output (ansi --escape "?1049h") + (ansi --escape "?2004h") | save --raw --force (if $nu.os-info.name == "windows" { "\\\\.\\CONOUT$" } else { "/dev/tty" })',
  ":redraw",
  ":reload-all",
]
"\\" = [
  ':insert-output rm --force ($nu.temp-dir | path join "yazi-chooser")',
  ":insert-output yazi '%{file_path_absolute}' --chooser-file=($nu.temp-dir | path join 'yazi-chooser')",
  ':insert-output (ansi --escape "?1049h") + (ansi --escape "?2004h") | save --raw --force (if $nu.os-info.name == "windows" { "\\\\.\\CONOUT$" } else { "/dev/tty" })',
  ":set-register | %reg{@}",
  ':set-register @ %sh{let restore = ":set-register @ %%reg{|}<ret>"; if ($nu.temp-dir | path join "yazi-chooser" | path exists) { ":open %%sh{open --raw ($nu.temp-dir | path join \"yazi-chooser\")}<ret>" + $restore } else { $restore }}',
  "replay_macro",
  ":redraw",
]
