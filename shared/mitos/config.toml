theme = "kanagawa-rich"

[editor]
icons = true
shell = ["C:/Users/ohirume/scoop/apps/nu/current/nu.exe", "-c"]

[editor.breadcrumb]
enable = true

[editor.cursor.shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.completion]
trigger-length = 1

[editor.files]
default-line-ending = "lf"

[editor.files.save]
atomic = false
trim-final-newlines = true
trim-trailing-whitespace = true

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.diagnostics.inline]
cursor-line = "warning"

[editor.diagnostics.end-of-line]
severity = "hint"

[editor.rainbow-brackets]
enable = true

[editor.lsp.progress]
enable = true

[editor.lsp.inlay-hints]
enable = true

[editor.statusline]
left = [
  "mode",
  "branch",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
  "diagnostics",
]
right = [
  "spinner",
  "code-action-hint",
  "file-encoding",
  "file-indent-style",
  "file-line-ending",
  "file-type",
  "selections",
  "register",
  "position",
  "total-line-numbers",
]

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"
color = true

[editor.whitespace.render]
tab = "all"

[editor.mouse]
enable = false

[keys.normal]
C-g = ":sh wt -w 0 new-tab -d $env.PWD lazygit"
"\\" = ":sh wt -w 0 new-tab -d $env.PWD yazi"
