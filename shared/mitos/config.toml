theme = "kanagawa-rich"

[editor]
icons = true
shell = ["C:/Users/ohirume/scoop/apps/nu/current/nu.exe", "-c"]

[editor.breadcrumb]
enable = true

[editor.cursor.shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.completion]
trigger-length = 1

[editor.files]
default-line-ending = "lf"

[editor.files.save]
atomic = false
trim-final-newlines = true
trim-trailing-whitespace = true

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.diagnostics.inline]
cursor-line = "warning"

[editor.diagnostics.end-of-line]
severity = "hint"

[editor.rainbow-brackets]
enable = true

[editor.lsp.progress]
enable = true

[editor.lsp.inlay-hints]
enable = true

[editor.statusline]
left = [
  "mode",
  "branch",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
  "diagnostics",
]
right = [
  "spinner",
  "code-action-hint",
  "file-encoding",
  "file-indent-style",
  "file-line-ending",
  "file-type",
  "selections",
  "register",
  "position",
  "total-line-numbers",
]

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"
color = true

[editor.whitespace.render]
tab = "all"

[editor.mouse]
enable = false

[keys.normal]
C-g = [
  ":write-all",
  ":vsplit",
  ":quit",
  ':insert-output lazygit out+err> (if $nu.os-info.name == "windows" { "\\\\.\\CONOUT$" } else { "/dev/tty" })',
  ':insert-output (ansi --escape "?1049h") + (ansi --escape "?2004h") | save --raw --force (if $nu.os-info.name == "windows" { "\\\\.\\CONOUT$" } else { "/dev/tty" })',
  ":redraw",
  ":reload-all",
]
"\\" = [
  ':insert-output rm --force ($nu.temp-dir | path join "yazi-chooser")',
  ":insert-output yazi '%{file_path_absolute}' --chooser-file=($nu.temp-dir | path join 'yazi-chooser')",
  ':insert-output (ansi --escape "?1049h") + (ansi --escape "?2004h") | save --raw --force (if $nu.os-info.name == "windows" { "\\\\.\\CONOUT$" } else { "/dev/tty" })',
  ":set-register | %reg{@}",
  ':set-register @ %sh{let restore = ":set-register @ %%reg{|}<ret>"; if ($nu.temp-dir | path join "yazi-chooser" | path exists) { ":open %%sh{open --raw ($nu.temp-dir | path join \"yazi-chooser\")}<ret>" + $restore } else { $restore }}',
  "replay_macro",
  ":redraw",
]
